version: "3.8"

services:
  # Unified API Service - combines all microservices
  unified-api:
    build:
      context: ./problem-solver/py/unified_service
      dockerfile: Dockerfile
    image: ostis-ann-unified-api:latest
    container_name: ostis-ann-unified-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./problem-solver/py/unified_service:/app:delegated
      - unified-chroma-db:/app/chroma_db
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=tinyllama 
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - SQLITE_DB_NAME=/app/unified_rag_app.db
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    networks:
      - ostis-ann
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  frontend:
    build:
      context: ./problem-solver/py/app/frontend
      dockerfile: Dockerfile
    image: ostis-ann-frontend:dev
    container_name: ostis-ann-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "8080:8080"
    volumes:
      - ./problem-solver/py/app/frontend:/app:delegated
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_KEYCLOAK_BASE=https://localhost:8443
      - VITE_KEYCLOAK_REALM=ostis-ann
      - VITE_KEYCLOAK_CLIENT_ID=spa-client
      - VITE_REDIRECT_URI=https://frontend.local.test/auth/callback
      # Frontend talks to gateway, which proxies /api/* to backend API
      - VITE_GATEWAY_BASE=https://gateway.local.test
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
    networks:
      - ostis-ann

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      retries: 5
    networks:
      - ostis-ann

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8443
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_RELATIVE_PATH: /
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_ADDRESS_FORWARDING: "true"
      KC_HTTP_ENABLED: "true"
    entrypoint: /bin/bash
    command: -c "/opt/keycloak/bin/kc.sh build --features=scripts && /opt/keycloak/bin/kc.sh start-dev --import-realm"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes:ro
      - ./keycloak-realm:/opt/keycloak/data/import:ro
    restart: unless-stopped
    networks:
      - ostis-ann
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2
    container_name: ostis-ann-caddy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - unified-api
      - frontend
      - gateway
      - keycloak
    restart: unless-stopped
    networks:
      - ostis-ann

  gateway:
    build:
      context: ./problem-solver/py
      dockerfile: gateway/Dockerfile
    image: ostis-ann-gateway:dev
    container_name: ostis-ann-gateway
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ostis-ann
      - TOKEN_ISSUER=https://localhost:8443/realms/ostis-ann
      - RESOURCE_AUDIENCE=backend-service
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8001,https://frontend.local.test,https://gateway.local.test
      - TARGET_API=http://unified-api:8000
      - JWKS_TTL=300
      - FORCE_HTTPS=true
      - LOG_LEVEL=DEBUG
    networks:
      - ostis-ann





